<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="estilo.css">
<script src="negocio.js"></script>
<script src="sistema.js"></script>
<style>
body { padding-bottom: 32px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 0 8px; }
.top h1 { font-size: 1.5rem; font-weight: 800; }
.top small { display: block; color: var(--suave); font-size: .8rem; }
.link { background: none; border: 0; color: var(--suave); font: 500 .9rem var(--body); text-decoration: underline; cursor: pointer; padding: 6px; }
.tira { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; }
.tira .dia { position: relative; }
.tira .dia .n { font-size: .7rem; font-weight: 600; color: var(--acento); }
.tira .dia.on .n { color: #fff; }
.tira .dia.cerrado { opacity: .5; }
.cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.cab h2 { font-size: 1.4rem; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--tinta); font-size: 1rem; font-weight: 600; flex-direction: row; cursor: pointer; }
.switch small { display: block; font-weight: 400; font-size: .82rem; color: var(--suave); }
.switch input { appearance: none; -webkit-appearance: none; width: 52px; height: 30px; flex-shrink: 0; border-radius: 999px; background: var(--linea); position: relative; cursor: pointer; padding: 0; border: 0; transition: background .2s; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch input:checked { background: var(--ok); }
.switch input:checked::after { transform: translateX(22px); }
.switch input:disabled { opacity: .5; cursor: default; }
.filtros { display: flex; gap: 8px; flex-wrap: wrap; }
.filtro { font: 500 .88rem var(--body); padding: 7px 14px; border-radius: 999px; border: 1px solid var(--linea); background: var(--fondo); color: var(--tinta); cursor: pointer; }
.filtro.on { background: var(--tinta); color: var(--fondo); border-color: var(--tinta); }
.agenda { display: flex; flex-direction: column; background: var(--sup); border: 1px solid var(--linea); border-radius: 14px; }
.slot { display: grid; grid-template-columns: 54px 1fr; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--linea); align-items: start; }
.slot:first-child { border-top: 0; }
.slot > time { font-weight: 600; font-variant-numeric: tabular-nums; padding-top: 2px; }
.slot.libre > time, .slot.libre .vacio { color: color-mix(in srgb, var(--tinta) 35%, var(--fondo)); font-weight: 400; }
.turno { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 10px; background: var(--fondo); border-left: 4px solid var(--acento); }
.turno + .turno { margin-top: 6px; }
.turno b { font-size: 1rem; }
.turno .det { font-size: .85rem; color: var(--suave); }
.turno .acc { display: flex; gap: 8px; flex-wrap: wrap; }
.turno .acc .btn { padding: 7px 12px; font-size: .85rem; }
.cancelados { display: flex; flex-direction: column; gap: 10px; }
.cancelados .turno { border-left-color: var(--cerrado); }
.ok-txt { color: var(--ok); font-weight: 600; font-size: .85rem; }
.resumen { display: flex; gap: 16px; font-size: .9rem; color: var(--suave); }
.resumen b { color: var(--tinta); font-family: var(--display); font-size: 1.3rem; display: block; }
.confirmar { background: color-mix(in srgb, var(--cerrado) 8%, var(--sup)); border-color: color-mix(in srgb, var(--cerrado) 35%, var(--linea)); }
.confirmar .acc { display: flex; gap: 8px; flex-wrap: wrap; }
.confirmar .aviso { margin-top: -6px; }
.confirmar .acc .btn { flex: 1 1 auto; }
.cerrados summary { cursor: pointer; font-weight: 600; padding: 2px 0; }
.cerrados .lista-c { display: flex; flex-direction: column; margin-top: 10px; }
.cerrados .item-c { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--linea); }
.cerrados .item-c small { display: block; color: var(--suave); font-size: .8rem; }
.cerrados .item-c .btn { padding: 7px 12px; font-size: .85rem; flex-shrink: 0; }
.cerrados .atajo { display: flex; gap: 8px; align-items: flex-end; margin-top: 10px; padding-top: 12px; border-top: 1px solid var(--linea); }
.cerrados .atajo label { flex: 1; }
.fecha-cab { font-weight: 600; font-size: .85rem; padding: 8px 14px 2px; color: var(--suave); border-top: 1px solid var(--linea); }
.fecha-cab:first-child { border-top: 0; }
.login { max-width: 380px; margin: 12vh auto 0; }
.modo { background: var(--acento-suave); color: var(--tinta); border-radius: 12px; padding: 10px 14px; font-size: .85rem; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
</style>
</head>
<body>
<main class="wrap">

  <!-- Login (solo en modo real) -->
  <div id="vLogin" hidden>
    <form class="card login" id="loginForm">
      <h1 style="font-size:1.6rem" id="lNombre">Panel</h1>
      <p class="aviso">Entrá con el email y la contraseña del local.</p>
      <label>Email<input id="lEmail" type="email" autocomplete="username" required></label>
      <label>Contraseña<input id="lClave" type="password" autocomplete="current-password" required></label>
      <p class="error" id="lError" role="alert" hidden></p>
      <button class="btn pri" type="submit">Entrar</button>
    </form>
  </div>

  <!-- Panel -->
  <div id="vPanel" hidden>
    <header class="top">
      <div><small>Panel de turnos</small><h1 id="pNombre"></h1></div>
      <div><a class="link" id="verWeb" target="_blank" rel="noopener">Ver web</a><button class="link" id="salir" type="button">Salir</button></div>
    </header>
    <div class="modo" id="modoDemo" hidden><span>Modo demo: los datos se guardan solo en este dispositivo.</span><button class="link" id="reiniciar" type="button">Reiniciar</button></div>

    <section style="padding-top:12px">
      <div class="tira" id="tira" aria-label="Días"></div>

      <div class="card">
        <div class="cab">
          <h2 id="dTitulo"></h2>
          <div class="resumen"><span><b id="dCant">0</b>turnos</span></div>
        </div>
        <label class="switch"><span>Reservas abiertas<small id="dSwitchTxt"></small></span><input type="checkbox" role="switch" id="dSwitch"></label>
        <div class="card confirmar" id="dPregunta" hidden role="alert">
          <b id="dPreguntaTxt"></b>
          <p class="aviso" id="dPreguntaSub" hidden></p>
          <div class="acc" id="dPreguntaAcc"></div>
        </div>
      </div>

      <details class="card cerrados" id="cerrados">
        <summary id="cerrSum">Días cerrados</summary>
        <div class="lista-c" id="cerrLista"></div>
        <div class="atajo" id="cerrAtajo">
          <label>Cerrar para siempre<select id="cerrDow"></select></label>
          <button class="btn sec" id="cerrBtn" type="button">Cerrar siempre</button>
        </div>
      </details>

      <div class="cancelados" id="cancelados" hidden>
        <h2 style="font-size:1.25rem">Cancelados: avisá a cada uno</h2>
        <p class="aviso">Tocá "Avisar" y se abre WhatsApp con el mensaje escrito y el link para que elija otro horario.</p>
        <div class="agenda" id="cancList"></div>
      </div>

      <div class="filtros" id="filtros"></div>
      <div class="agenda" id="agenda"></div>
      <button class="btn sec" id="dCancelarDia" type="button">Cancelar todos los turnos de este día</button>
    </section>
  </div>
</main>

<script>
const N = NEGOCIO, U = Turnos.U, $ = (id) => document.getElementById(id), el = U.el;
const DIAS3 = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
const r = document.documentElement.style;
r.setProperty("--acento", N.colores.acento); r.setProperty("--fondo", N.colores.fondo); r.setProperty("--tinta", N.colores.tinta);
document.title = "Panel · " + N.nombre;
$("pNombre").textContent = N.nombre; $("lNombre").textContent = N.nombre;
$("verWeb").href = "index.html";

let T = null, turnos = [], diasMap = {}, dia = U.hoyIso(), filtro = "", confirmando = null;
// pregunta = cuadro "¿Solo ese día o siempre?": { tipo: "cerrar" | "cancelar" | "abrir", paso: "alcance" | "turnos", ref: fecha o null, dow: 0..6, alcance }
let pregunta = null;
const DESDE = () => U.sumarDias(U.hoyIso(), -1), HASTA = () => U.sumarDias(U.hoyIso(), (N.diasParaReservar || 14) + 7);

function toast(msg) { alert(msg); }
const confirmadosDe = (f) => turnos.filter(t => t.fecha === f && t.estado === "confirmado");
/* ---- Días de la semana (cierres semanales) ---- */
const dowDe = (f) => U.fechaDe(f).getDay();
const esFecha = (k) => /^\d{4}-\d{2}-\d{2}$/.test(k);
const cerradoSemana = (d) => { const x = diasMap[Turnos.idSemana(d)]; return !!x && x.abierto === false; };
const todosLos = (d) => "todos los " + U.DIAS[d].toLowerCase() + (d === 0 || d === 6 ? "s" : "");   // "todos los jueves"
const mayus = (t) => t[0].toUpperCase() + t.slice(1);
// Turnos confirmados de hoy en adelante que caen en ese día de la semana
const turnosDeSemana = (d) => turnos.filter(t => t.estado === "confirmado" && t.fecha >= U.hoyIso() && dowDe(t.fecha) === d);
const fechasConDato = (d) => Object.keys(diasMap).filter(k => esFecha(k) && k >= U.hoyIso() && dowDe(k) === d);
const listaDe = (alcance, p) => alcance === "dia" ? confirmadosDe(p.ref) : turnosDeSemana(p.dow);
// "jueves 22/10 (2), jueves 29/10 (1)"
function resumenTurnos(lista) {
  const por = {}; lista.forEach(t => { por[t.fecha] = (por[t.fecha] || 0) + 1; });
  return Object.keys(por).sort().map(f => U.fechaCorta(f) + " (" + por[f] + ")").join(", ");
}
const nTurnos = (n) => n + (n === 1 ? " turno" : " turnos");

async function recargar() {
  try { [turnos, diasMap] = await Promise.all([T.turnos(DESDE(), HASTA()), T.dias(DESDE(), HASTA())]); pintar(); }
  catch (e) { $("agenda").replaceChildren(el("div", { class: "slot" }, el("span"), el("span", { class: "error", text: "No se pudieron cargar los turnos. Revisá la conexión." }))); }
}

function pintar() { pintarTira(); pintarDia(); }

function pintarTira() {
  const fechas = []; for (let f = U.hoyIso(); f <= HASTA(); f = U.sumarDias(f, 1)) fechas.push(f);
  $("tira").replaceChildren(...fechas.map(f => {
    const d = U.fechaDe(f), n = confirmadosDe(f).length, abierto = Turnos.abiertoDia(f, diasMap);
    return el("button", { type: "button", class: "dia" + (f === dia ? " on" : "") + (abierto ? "" : " cerrado"), "aria-pressed": String(f === dia),
      "aria-label": U.fechaLarga(f) + ", " + n + " turnos" + (abierto ? "" : ", cerrado"),
      onclick: () => { dia = f; confirmando = null; pregunta = null; pintar(); } },
      el("small", { text: f === U.hoyIso() ? "Hoy" : DIAS3[d.getDay()] }), el("b", { text: String(d.getDate()) }),
      el("span", { class: "n", text: abierto ? (n ? n + " t" : "·") : "cerr." }));
  }));
  const on = $("tira").querySelector(".on"); if (on) on.scrollIntoView({ inline: "center", block: "nearest" });
}

function pintarDia() {
  const tramos = Turnos.tramosDe(dia), abierto = Turnos.abiertoDia(dia, diasMap), conf = confirmadosDe(dia);
  $("dTitulo").textContent = (dia === U.hoyIso() ? "Hoy, " : "") + U.fechaLarga(dia);
  $("dCant").textContent = conf.length;
  $("dSwitch").checked = abierto;
  $("dSwitch").disabled = !tramos.length;
  const dow = dowDe(dia), ov = diasMap[dia], sem = cerradoSemana(dow);
  $("dSwitchTxt").textContent = !tramos.length ? "Cerrado por horario"
    : abierto ? (sem && ov ? "Abierto solo este día: " + todosLos(dow) + " están cerrados" : "Los clientes pueden reservar este día")
    : sem ? "Cerrado " + todosLos(dow) : "Nadie puede reservar este día";
  pintarPregunta();
  pintarCerrados();
  $("dCancelarDia").hidden = !conf.length;

  // Filtro por estilista
  $("filtros").hidden = N.equipo.length < 2;
  $("filtros").replaceChildren(...[{ id: "", nombre: "Todos" }, ...N.equipo].map(p =>
    el("button", { type: "button", class: "filtro" + (filtro === p.id ? " on" : ""), "aria-pressed": String(filtro === p.id), text: p.nombre, onclick: () => { filtro = p.id; pintarDia(); } })));

  // Agenda: una fila cada 30 min con los turnos que empiezan en ese rato
  const lista = conf.filter(t => !filtro || t.estilista === filtro).sort((a, b) => a.hora.localeCompare(b.hora));
  const filas = [], usados = new Set();
  for (const [a, b] of tramos) for (let m = U.aMin(a); m < U.aMin(b); m += 30) {
    const aqui = lista.filter(t => { const x = U.aMin(t.hora); return x >= m && x < m + 30; });
    aqui.forEach(t => usados.add(t.id));
    filas.push(el("div", { class: "slot" + (aqui.length ? "" : " libre") }, el("time", { text: U.aHora(m) }),
      aqui.length ? el("div", {}, ...aqui.map(tarjeta)) : el("span", { class: "vacio", text: "Libre" })));
  }
  // Turnos fuera del horario (por si cambió el horario después de reservar)
  lista.filter(t => !usados.has(t.id)).forEach(t => filas.push(el("div", { class: "slot" }, el("time", { text: t.hora }), el("div", {}, tarjeta(t)))));
  $("agenda").replaceChildren(...(filas.length ? filas : [el("div", { class: "slot libre" }, el("span"), el("span", { class: "vacio", text: "Cerrado por horario." }))]));

  // Cancelados de hoy en adelante, agrupados por fecha, para avisar
  const canc = turnos.filter(t => t.estado === "cancelado" && t.fecha >= U.hoyIso() && (!filtro || t.estilista === filtro))
    .sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));
  const filasC = []; let ult = "";
  canc.forEach(t => {
    if (t.fecha !== ult) { ult = t.fecha; filasC.push(el("div", { class: "fecha-cab", text: mayus(U.fechaCorta(t.fecha)) })); }
    filasC.push(el("div", { class: "slot" }, el("time", { text: t.hora }), el("div", {}, tarjetaCancelada(t))));
  });
  $("cancelados").hidden = !canc.length;
  $("cancList").replaceChildren(...filasC);
}

/* ---------- Cuadro "¿Solo ese día o siempre?" ---------- */
function preguntar(p) { pregunta = p; confirmando = null; pintarDia(); $("dPregunta").scrollIntoView({ block: "center", behavior: "smooth" }); }
function cerrarPregunta() { pregunta = null; pintarDia(); }
const boton = (texto, clase, fn) => el("button", { class: "btn " + clase, type: "button", text: texto, onclick: fn });

function pintarPregunta() {
  const p = pregunta, box = $("dPregunta");
  box.hidden = !p;
  if (!p) return;
  const d = p.dow, sub = $("dPreguntaSub"), acc = [];
  sub.hidden = true;
  const solo = p.ref ? "el " + U.fechaCorta(p.ref) : "";
  if (p.paso === "alcance") {
    if (p.tipo === "cerrar") {
      $("dPreguntaTxt").textContent = "¿Solo ese día o siempre?";
      sub.textContent = "Cerrar las reservas solo " + solo + ", o " + todosLos(d) + "."; sub.hidden = false;
      acc.push(boton("Solo " + solo, "pri", () => elegirCierre("dia", p)), boton(mayus(todosLos(d)), "sec", () => elegirCierre("semana", p)));
    } else if (p.tipo === "cancelar") {
      const a = confirmadosDe(p.ref).length, b = turnosDeSemana(d).length;
      $("dPreguntaTxt").textContent = "¿Solo este día o siempre?";
      sub.textContent = "Se cancelan los turnos y después les avisás por WhatsApp. Esto no cierra las reservas: para eso usá el interruptor."; sub.hidden = false;
      acc.push(boton("Solo " + solo + " (" + nTurnos(a) + ")", "peligro", () => { pregunta = null; cancelar(confirmadosDe(p.ref)); }));
      if (b > a) acc.push(boton(mayus(todosLos(d)) + " (" + nTurnos(b) + ")", "peligro", () => { pregunta = null; cancelar(turnosDeSemana(d)); }));
    } else {
      $("dPreguntaTxt").textContent = "Cerraste " + todosLos(d) + ". ¿Abrimos solo ese día o siempre?";
      acc.push(boton("Abrir solo " + solo, "pri", () => abrirDia(p)), boton("Abrir " + todosLos(d), "sec", () => abrirSemana(p)));
    }
  } else {   // paso "turnos": hay turnos confirmados que se verían afectados
    const lista = listaDe(p.alcance, p);
    $("dPreguntaTxt").textContent = "Hay " + nTurnos(lista.length) + (p.alcance === "dia" ? " ese día" : " en " + todosLos(d)) + ". ¿Qué hacemos?";
    if (p.alcance === "semana") { sub.textContent = resumenTurnos(lista); sub.hidden = false; }
    acc.push(boton("Cerrar y cancelar todos", "peligro", () => aplicarCierre(p.alcance, p, true)),
      boton("Solo cerrar reservas nuevas", "sec", () => aplicarCierre(p.alcance, p, false)));
  }
  acc.push(boton("Volver", "sec", cerrarPregunta));
  $("dPreguntaAcc").replaceChildren(...acc);
}

function elegirCierre(alcance, p) {
  if (listaDe(alcance, p).length) preguntar({ ...p, paso: "turnos", alcance });
  else aplicarCierre(alcance, p, false);
}
async function aplicarCierre(alcance, p, cancelarTurnos) {
  const lista = cancelarTurnos ? listaDe(alcance, p) : [];
  pregunta = null;
  try {
    if (alcance === "dia") await T.setDia(p.ref, false);
    else {
      // "Siempre": se limpian los datos puntuales de ese día de la semana para que no queden jueves abiertos por error
      for (const f of fechasConDato(p.dow)) await T.borrarDia(f);
      await T.setDia(Turnos.idSemana(p.dow), false);
    }
    for (const t of lista) await T.cancelar(t);
  } catch (e) { toast("No se pudo cerrar el día. Revisá la conexión."); }
  await recargar();
  if (lista.length) $("cancelados").scrollIntoView({ block: "start" });
}
async function abrirDia(p) {
  pregunta = null;
  try { await T.setDia(p.ref, true); } catch (e) { toast("No se pudo abrir el día."); }
  await recargar();
}
async function abrirSemana(p) {
  pregunta = null;
  try { await T.borrarDia(Turnos.idSemana(p.dow)); if (diasMap[p.ref]) await T.borrarDia(p.ref); } catch (e) { toast("No se pudo abrir el día."); }
  await recargar();
}
async function borrar(id) {
  try { await T.borrarDia(id); } catch (e) { toast("No se pudo reabrir. Revisá la conexión."); }
  await recargar();
}

/* ---------- Días cerrados ---------- */
function pintarCerrados() {
  const semanales = [1, 2, 3, 4, 5, 6, 0].filter(cerradoSemana);
  const puntuales = Object.keys(diasMap).filter(k => esFecha(k) && k >= U.hoyIso() && Turnos.tramosDe(k).length &&
    (diasMap[k].abierto === false ? !cerradoSemana(dowDe(k)) : cerradoSemana(dowDe(k)))).sort();
  const item = (titulo, nota, texto, fn) => el("div", { class: "item-c" }, el("div", {}, el("b", { text: titulo }), nota ? el("small", { text: nota }) : null), boton(texto, "sec", fn));
  const filas = [
    ...semanales.map(d => item(mayus(todosLos(d)), "Cierre semanal", "Reabrir", () => borrar(Turnos.idSemana(d)))),
    ...puntuales.map(f => diasMap[f].abierto === false
      ? item(mayus(U.fechaCorta(f)), "Cerrado solo ese día", "Reabrir", () => borrar(f))
      : item(mayus(U.fechaCorta(f)), "Abierto solo ese día", "Volver a cerrar", () => borrar(f)))];
  $("cerrSum").textContent = "Días cerrados" + (semanales.length + puntuales.length ? " (" + (semanales.length + puntuales.length) + ")" : "");
  $("cerrLista").replaceChildren(...(filas.length ? filas : [el("p", { class: "aviso", text: "No hay días cerrados a futuro." })]));
  const posibles = [1, 2, 3, 4, 5, 6, 0].filter(d => (N.horarios[d] || []).length && !cerradoSemana(d));
  const previo = $("cerrDow").value;
  $("cerrDow").replaceChildren(...posibles.map(d => el("option", { value: String(d), text: mayus(todosLos(d)) })));
  if (posibles.some(d => String(d) === previo)) $("cerrDow").value = previo;
  $("cerrAtajo").hidden = !posibles.length;
}

const linkCliente = (t, texto) => U.wa(t.ejemplo ? "" : t.celular, texto);
const celVisible = (c) => c ? (c.startsWith("598") ? "0" + c.slice(3) : "+" + c) : "turno de ejemplo";

function tarjeta(t) {
  const p = U.estilista(t.estilista);
  const acc = confirmando === t.id
    ? el("div", { class: "acc" }, el("span", { class: "det", text: "¿Cancelar este turno?" }),
        el("button", { class: "btn peligro", type: "button", text: "Sí, cancelar", onclick: () => cancelar([t]) }),
        el("button", { class: "btn sec", type: "button", text: "No", onclick: () => { confirmando = null; pintarDia(); } }))
    : el("div", { class: "acc" },
        el("a", { class: "btn sec", href: linkCliente(t, "Hola " + t.nombre + ", te escribo de " + N.nombre + "."), target: "_blank", rel: "noopener", text: "WhatsApp" }),
        el("button", { class: "btn sec", type: "button", text: "Cancelar", onclick: () => { confirmando = t.id; pintarDia(); } }));
  return el("div", { class: "turno" },
    el("b", { text: t.nombre }),
    el("span", { class: "det", text: [t.hora + " · " + t.servicio + " (" + t.minutos + " min)", N.equipo.length > 1 ? p.nombre : null, celVisible(t.celular)].filter(Boolean).join(" · ") }),
    acc);
}
function tarjetaCancelada(t) {
  const p = U.estilista(t.estilista);
  return el("div", { class: "turno" },
    el("b", { text: t.nombre }),
    el("span", { class: "det", text: [t.servicio, N.equipo.length > 1 ? p.nombre : null, celVisible(t.celular)].filter(Boolean).join(" · ") }),
    el("div", { class: "acc" },
      el("a", { class: "btn " + (t.avisado ? "sec" : "pri"), href: linkCliente(t, Turnos.mensajeCancelacion(t)), target: "_blank", rel: "noopener",
        text: t.avisado ? "Avisar de nuevo" : "Avisar por WhatsApp", onclick: () => avisado(t) }),
      t.avisado ? el("span", { class: "ok-txt", text: "✓ Avisado" }) : null));
}

async function avisado(t) { if (t.avisado) return; try { await T.marcarAvisado(t.id); t.avisado = true; setTimeout(pintarDia, 300); } catch (e) {} }
async function cancelar(lista) {
  confirmando = null;
  try { for (const t of lista) await T.cancelar(t); } catch (e) { toast("No se pudo cancelar. Revisá la conexión."); }
  await recargar();
  if (lista.length) $("cancelados").scrollIntoView({ block: "start" });
}
$("dSwitch").addEventListener("change", () => {
  const quiere = $("dSwitch").checked, dow = dowDe(dia);
  $("dSwitch").checked = !quiere;   // el interruptor se mueve recién cuando se aplica el cambio
  if (!quiere) return preguntar({ tipo: "cerrar", paso: "alcance", ref: dia, dow });
  if (cerradoSemana(dow)) return preguntar({ tipo: "abrir", paso: "alcance", ref: dia, dow });
  pregunta = null; borrar(dia);   // estaba cerrado solo ese día: se borra el cierre y vuelve a la normalidad
});
$("dCancelarDia").addEventListener("click", () => preguntar({ tipo: "cancelar", paso: "alcance", ref: dia, dow: dowDe(dia) }));
$("cerrBtn").addEventListener("click", () => {
  const dow = Number($("cerrDow").value);
  elegirCierre("semana", { tipo: "cerrar", ref: null, dow });
});
$("reiniciar").addEventListener("click", async () => { await T.reiniciar(); await recargar(); });
$("salir").addEventListener("click", async () => { await T.logout(); if (T.modo === "demo") location.href = "index.html"; });

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault(); $("lError").hidden = true;
  try { await T.login($("lEmail").value.trim(), $("lClave").value); }
  catch (err) { $("lError").textContent = "Email o contraseña incorrectos."; $("lError").hidden = false; }
});

(async () => {
  T = await Turnos.conectar();
  $("modoDemo").hidden = T.modo !== "demo";
  T.onAuth(async (u) => {
    const ok = u && (T.modo === "demo" || (N.admins || []).includes(u.email));
    $("vLogin").hidden = !!ok; $("vPanel").hidden = !ok;
    if (u && !ok) { $("lError").textContent = "Esta cuenta no tiene acceso al panel."; $("lError").hidden = false; T.logout(); }
    if (ok) { await recargar(); }
  });
  // Refresca solo cada minuto y al volver a la app
  setInterval(() => { if (!$("vPanel").hidden && !confirmando && !pregunta) recargar(); }, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("vPanel").hidden) recargar(); });
})();
</script>
</body>
